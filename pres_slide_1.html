<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VILAVI Strategy - Slide 1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .slide { width: 800px; height: 500px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 24px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; }
        .header { font-size: 32px; font-weight: 800; border-left: 6px solid #ef4444; padding-left: 20px; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); }
        .card-high { border-color: #ef4444; background: rgba(239, 68, 68, 0.05); }
        .label { font-size: 14px; text-transform: uppercase; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
        .value { font-size: 28px; font-weight: 700; color: #f8fafc; }
        .highlight { color: #ef4444; }
        .badge { display: inline-block; background: #ef4444; color: white; padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: bold; margin-top: 10px; }
        .footer { position: absolute; bottom: 30px; right: 40px; font-size: 12px; color: #475569; }
    </style>
</head>
<body><div style="position:fixed;top:10px;left:10px;z-index:9999;display:flex;gap:10px;"><button onclick="history.back()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:8px 15px;border-radius:10px;font-weight:bold;cursor:pointer;backdrop-filter:blur(10px);">← НАЗАД</button><button onclick="location.href='index.html'" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:8px 15px;border-radius:10px;font-weight:bold;cursor:pointer;backdrop-filter:blur(10px);">🏠 ДОМОЙ</button></div>
    <div class="slide">
        <div class="header">Этап 1: Стратегия <span class="highlight">Бизнес-Вход</span></div>
        <div class="grid">
            <div class="card">
                <div class="label">Твой вход</div>
                <div class="value">500 PV</div>
                <div class="badge">СТАТУС: BRONZE</div>
            </div>
            <div class="card card-high">
                <div class="label">Главная привилегия</div>
                <div class="value">2 Месяца</div>
                <div class="badge">АКТИВНОСТЬ В ПОДАРОК</div>
            </div>
            <div class="card">
                <div class="label">Стартовый бонус</div>
                <div class="value highlight">25%</div>
                <p style="font-size: 14px; color: #94a3b8;">Максимальная выплата с первого чека партнера.</p>
            </div>
            <div class="card">
                <div class="label">Глубина наставника</div>
                <div class="value">3 Линии</div>
                <p style="font-size: 14px; color: #94a3b8;">Зарабатывай на работе своей команды сразу.</p>
            </div>
        </div>
        <div class="footer">Майк Аналитик | VILAVI Brainstorm Team</div>
    </div>
</body>
</html>
