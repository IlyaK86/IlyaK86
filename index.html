<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mike Hub v2.5 | Direct API</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --accent-vilavi: #ef4444;
            --accent-work: #3b82f6;
            --text: #f8fafc;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: var(--text);
            margin: 0; padding: 16px; min-height: 100vh;
            display: flex; flex-direction: column; gap: 16px;
        }
        .header h1 { font-size: 20px; text-align: center; margin: 10px 0; background: linear-gradient(to right, #60a5fa, #f87171); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .tab-container { display: flex; gap: 8px; margin-bottom: 5px; }
        .tab { flex: 1; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; }
        .tab.active { background: var(--card); border-color: var(--accent-work); color: var(--accent-work); }
        .tab.vilavi-active { border-color: var(--accent-vilavi); color: var(--accent-vilavi); }

        .section { display: none; }
        .section.active { display: flex; flex-direction: column; gap: 16px; }

        .card { background: var(--card); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; }
        .label { font-size: 10px; font-weight: bold; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        
        .btn-action { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .btn-action:active { transform: scale(0.97); filter: brightness(1.2); }
        .work { background: #2563eb; }
        .vilavi { background: #dc2626; }
        
        .btn-small { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; font-size: 12px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header"><h1>Майк: Прямое Управление</h1></div>

    <div class="tab-container">
        <div id="t-main" class="tab active" onclick="showTab('main')">🤖 ГЛАВНАЯ</div>
        <div id="t-vilavi" class="tab" onclick="showTab('vilavi')">🏆 VILAVI</div>
    </div>

    <div id="s-main" class="section active">
        <div class="card">
            <div class="label">Режим ассистента</div>
            <button class="btn-action work" onclick="sendCommand('/context', 'work')">💼 РАБОЧИЙ КОНТЕКСТ</button>
            <button class="btn-action" style="background: #10b981" onclick="sendCommand('/context', 'personal')">🏠 ЛИЧНЫЙ КОНТЕКСТ</button>
        </div>
    </div>

    <div id="s-vilavi" class="section">
        <div class="card">
            <div class="label">Маркетинг-инструменты</div>
            <button class="btn-action vilavi" onclick="sendCommand('/action', 'vilavi_calc')">🧮 КАЛЬКУЛЯТОР ПРИБЫЛИ</button>
            <button class="btn-action vilavi" onclick="sendCommand('/action', 'vilavi_pres')">📄 СОЗДАТЬ ПРЕЗЕНТАЦИЮ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function showTab(tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active', 'vilavi-active'));
            document.getElementById('s-' + tab).classList.add('active');
            const el = document.getElementById('t-' + tab);
            el.classList.add('active');
            if(tab === 'vilavi') el.classList.add('vilavi-active');
        }

        async function sendCommand(cmd, val) {
            // Визуальный отклик
            tg.HapticFeedback.notificationOccurred('success');
            
            try {
                const response = await fetch('http://85.209.132.81:5678/webhook/mike-hub', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd, value: val, userId: 351234035 })
                });
                
                if (response.ok) {
                    tg.showAlert('Майк принял команду!');
                } else {
                    throw new Error('Ошибка связи');
                }
            } catch (e) {
                // Если обычный fetch не прошел (блокировка CORS), пробуем через tg.sendData
                tg.sendData(JSON.stringify({command: cmd, value: val}));
                tg.showAlert('Сообщение отправлено боту!');
            }
        }
    </script>
</body>
</html>
