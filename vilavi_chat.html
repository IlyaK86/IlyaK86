<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VILAVI AI Expert | Mike</title>
    <style>
        :root { --bg: #020617; --primary: #ef4444; --card: rgba(30, 41, 59, 0.7); --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        .chat-header { padding: 20px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 15px; }
        .status-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }
        
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 18px; border-radius: 18px; font-size: 15px; line-height: 1.5; }
        .msg.user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 4px; }

        .input-area { padding: 20px; background: rgba(15, 23, 42, 0.9); display: flex; gap: 10px; }
        input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; outline: none; }
        button { background: var(--primary); border: none; color: white; padding: 12px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-header">
        <div class="status-dot"></div>
        <div>
            <div style="font-weight: 800; font-size: 18px;">Майк: VILAVI Expert</div>
            <div style="font-size: 11px; color: #64748b;">AI-Консультант по маркетинг-плану</div>
        </div>
    </div>

    <div class="messages" id="chat-box">
        <div class="msg bot">Привет! Я Майк. Я изучил все документы VILAVI и готов ответить на любой вопрос по цифрам, бонусам или логистике. С чего начнем?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Введите ваш вопрос..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">ОТПРАВИТЬ</button>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('user-input');
            const box = document.getElementById('chat-box');
            if(!input.value) return;

            const text = input.value;
            input.value = '';

            // Добавляем сообщение пользователя
            box.innerHTML += `<div class="msg user">${text}</div>`;
            box.scrollTop = box.scrollHeight;

            // Сигнал в n8n (нашего Майка-VILAVI)
            try {
                const response = await fetch('http://85.209.132.81:5678/webhook/mike-hub', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ command: 'expert_q', value: text, source: 'web_chat' })
                });
                
                // В финальной версии мы будем получать ответ от n8n прямо сюда.
                // Пока добавим имитацию ожидания
                box.innerHTML += `<div class="msg bot"><i>Майк изучает документы... Ответ придет в Telegram.</i></div>`;
            } catch (e) {
                box.innerHTML += `<div class="msg bot" style="color: #ef4444;">Ошибка связи с сервером.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
